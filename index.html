<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Code After Dark · Post desk</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121720;color:#f2f3ed;font:16px/1.55 system-ui}main{max-width:840px;margin:auto;padding:40px 20px}header{color:#a9db92}h1{font-size:clamp(2.3rem,8vw,4rem);margin:10px 0}section{margin:24px 0;padding:22px;border:1px solid #44504e;border-radius:12px}input:not([type=checkbox]),textarea,button{padding:12px;border-radius:6px;font:inherit}input:not([type=checkbox]),textarea{width:100%;background:#202730;color:white;border:1px solid #62706b}textarea{min-height:100px}label{display:block;margin:12px 0}button{background:#b9e99e;color:#102010;border:0;cursor:pointer}article{padding:14px 0;border-top:1px solid #44504e;overflow-wrap:anywhere}p{white-space:pre-wrap}fieldset{border:0;padding:0}fieldset label{display:inline-block;margin-right:16px}</style>
<main><header>Code After Dark</header><h1>Post desk</h1><label>Scheduler key<input type="password" id="key" autocomplete="off"></label><button id="load">Open planner</button><p id="connections"></p>
<section><h2>Schedule a post</h2><form id="form"><fieldset><legend>Channels</legend><label><input type="checkbox" value="facebook"> Facebook</label><label><input type="checkbox" value="instagram"> Instagram</label><label><input type="checkbox" value="x"> X</label></fieldset><label>Caption<textarea id="caption" required></textarea></label><label>Public image URL<input id="media" type="url"></label><label>Publication time in Nigeria<input type="datetime-local" id="at" required></label><button>Schedule</button></form><p role="status" id="message"></p></section><h2>Publication queue</h2><div id="list"></div></main>
<script>
const el=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+el('key').value,'Content-Type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
function showError(e){el('message').textContent=e.message}
async function refresh(){const {posts,configured}=await api('/api/posts');el('connections').textContent='Configured channels: '+(configured.join(', ')||'none');el('list').replaceChildren();for(const p of posts){const item=document.createElement('article'),title=document.createElement('strong'),caption=document.createElement('p');title.textContent=[p.channel,new Date(p.due).toLocaleString('en-GB',{timeZone:'Africa/Lagos'}),p.status].join(' · ');caption.textContent=p.caption;item.append(title,caption);if(p.result){const result=document.createElement('small');result.textContent=p.result;item.append(result);}if(p.status==='queued'){const b=document.createElement('button');b.textContent='Cancel';b.onclick=async()=>{try{await api('/api/posts/'+p.id,{method:'DELETE'});await refresh()}catch(e){showError(e)}};item.append(b);}el('list').append(item)}}
el('load').onclick=()=>refresh().catch(showError);
el('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/posts',{method:'POST',body:JSON.stringify({caption:el('caption').value,media:el('media').value,channels:[...document.querySelectorAll('input:checked')].map(i=>i.value),at:el('at').value+'+01:00'})});el('form').reset();el('message').textContent='Added to the queue.';await refresh()}catch(err){showError(err)}};
</script></html>
